syntax = "proto3";

option go_package = "internal/grpc";

package shortener;
import "google/protobuf/timestamp.proto";

message PrivateDataSaved{
  string id = 1;
  PrivateDataType type = 2;
  bytes data = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  bytes nonce = 6;
  string login = 7;

  enum PrivateDataType{
    UNKNOWN_TYPE = 0;
    TEXT_TYPE = 1;
    FILE_TYPE = 2;
    AUTH_TYPE = 3;
    BANK_TYPE = 4;
  }
}